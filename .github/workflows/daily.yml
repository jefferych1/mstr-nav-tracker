name: Daily prices

on:
  schedule:
    # 22:30 UTC on weekdays — about 90 minutes after the US close, 06:30 the next morning
    # in Hong Kong. GitHub's scheduler can run a little late; that does not matter here.
    - cron: "30 22 * * 1-5"
  workflow_dispatch: # lets you run it by hand from the Actions tab

# Only one job may push at a time, or the daily and filings jobs can collide.
concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch prices and append to history
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: node scripts/daily.mjs

      - name: Commit if anything changed
        run: |
          git config user.name  "mstr-tracker bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "data: daily prices $(date -u +%Y-%m-%d)"
            # Another job may have pushed while this one ran.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
